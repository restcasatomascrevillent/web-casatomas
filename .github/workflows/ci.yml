# Comprobaciones automáticas de la web (propuesta de la auditoría de regresión
# del 18/10/2026). Ningún paso necesita secretos ni habla con Supabase o
# Stripe: los tests unitarios usan módulos virtuales vacíos y los E2E un build
# contra un Supabase de mentira local (scripts/e2e-build.mjs).
#
# BLOQUEAN: instalación reproducible, tests unitarios y E2E (incluye el build
# SSG completo). NO BLOQUEAN todavía (deuda previa): typecheck con 21 errores y
# ESLint con 10. Quitar `continue-on-error` cuando lleguen a cero.
name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-y-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitarios y de componentes
        run: npm test
      - name: Navegador para Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (build SSG + reservas, carta de vinos, cheques regalo, responsive)
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  calidad-no-bloqueante:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # continue-on-error en cada paso y no en el job: la deuda previa no bloquea y
      # el check sale en verde, con los errores en las anotaciones y en el resumen.
      # Con continue-on-error en el job, GitHub lo pintaba en rojo en cada PR.
      - name: Typecheck (21 errores previos)
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: ESLint (10 errores previos)
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Resumen
        if: always()
        run: |
          {
            echo "### Calidad (informativa, no bloquea)"
            echo "- Typecheck: ${{ steps.typecheck.outcome == 'success' && 'sin errores' || 'con errores previos, ver anotaciones' }}"
            echo "- ESLint: ${{ steps.lint.outcome == 'success' && 'sin errores' || 'con errores previos, ver anotaciones' }}"
          } >> "$GITHUB_STEP_SUMMARY"


  control-promocion:
    name: Validar promoción a producción
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Solo staging puede promocionarse a main
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$SOURCE_BRANCH" != "staging" ]; then
            echo "::error::Producción solo admite PR desde staging (rama recibida: $SOURCE_BRANCH)"
            exit 1
          fi
