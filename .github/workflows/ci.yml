# Comprobaciones automáticas de la web (propuesta de la auditoría de regresión
# del 18/10/2026). Ningún paso necesita secretos ni habla con Supabase o
# Stripe: los tests unitarios usan módulos virtuales vacíos y los E2E un build
# contra un Supabase de mentira local (scripts/e2e-build.mjs).
#
# BLOQUEAN: instalación reproducible, tests unitarios, typecheck de la app y de
# los E2E (0 errores),
# ESLint (0 errores; los avisos no bloquean) y E2E (incluye el build SSG
# completo). Typecheck y ESLint estaban ya a cero el 30/10/2026 (CT-REM-OPS-09).
name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-y-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitarios y de componentes
        run: npm test
      - name: Navegador para Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (build SSG + reservas, carta de vinos, cheques regalo, responsive)
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Typecheck de los E2E
        run: npx tsc --noEmit -p e2e
      - name: ESLint
        run: npm run lint -- --quiet

  control-promocion:
    name: Validar promoción a producción
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Solo staging puede promocionarse a main
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$SOURCE_BRANCH" != "staging" ]; then
            echo "::error::Producción solo admite PR desde staging (rama recibida: $SOURCE_BRANCH)"
            exit 1
          fi
