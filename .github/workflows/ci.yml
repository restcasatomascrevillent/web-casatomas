# Comprobaciones automáticas de la web (propuesta de la auditoría de regresión
# del 18/10/2026). Ningún paso necesita secretos ni habla con Supabase o
# Stripe: los tests unitarios usan módulos virtuales vacíos y los E2E un build
# contra un Supabase de mentira local (scripts/e2e-build.mjs).
#
# BLOQUEAN: instalación reproducible, tests unitarios, typecheck de la app y de
# los E2E (0 errores),
# ESLint (0 errores; los avisos no bloquean) y E2E (incluye el build SSG
# completo). Typecheck y ESLint estaban ya a cero el 30/10/2026 (CT-REM-OPS-09).
#
# DOS MODOS (pedido del dueño 10/11/2026: menos tests, que solo se revise lo que se modifica,
# para no agotar los minutos de GitHub Actions):
#   - LIGERO (push a staging y PR a staging o a ramas de trabajo): typecheck, ESLint de lo
#     cambiado (scripts/lint-cambios.mjs) y `npm run test:cambios` (solo los tests afectados).
#   - COMPLETO (PR o push hacia main, ramas release/*, y el lanzamiento a mano de «Release ·
#     preparar»): todo lo de siempre, suite completa, E2E con build SSG.
# Los jobs que protegen producción (tests-y-e2e, calidad, control-release) siguen existiendo con el
# mismo nombre; en modo ligero el job de calidad se salta (un check saltado cuenta como superado).
# Un push que solo toca docs/Markdown no lanza CI (paths-ignore); los PR siempre lo lanzan.
name: CI

on:
  pull_request:
  push:
    branches: [staging, main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Lo lanza «Release · preparar» sobre la rama release/X.Y.Z: los PR que abre Actions con su
  # token no disparan otros workflows (docs/PROCESO-DE-CAMBIOS.md).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # "true" → modo COMPLETO (camino a producción). "false" → modo LIGERO (staging y ramas de trabajo).
  COMPLETA: ${{ github.base_ref == 'main' || github.ref_name == 'main' || startsWith(github.ref_name, 'release/') || startsWith(github.head_ref, 'release/') }}
  # Base contra la que se mira «lo cambiado» en modo ligero: la rama destino del PR o el commit
  # anterior del push (si es rama nueva, los scripts usan origin/staging).
  BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'origin/staging' }}

jobs:
  tests-y-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Modo ligero: historia completa para comparar con la base. Modo completo: basta 1.
          fetch-depth: ${{ env.COMPLETA == 'true' && 1 || 0 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ---- Modo LIGERO (staging y ramas de trabajo) ----
      - name: Typecheck
        if: env.COMPLETA != 'true'
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Typecheck de los E2E
        if: env.COMPLETA != 'true'
        run: npx tsc --noEmit -p e2e
      - name: ESLint de lo cambiado
        if: env.COMPLETA != 'true'
        run: npm run lint:cambios
      - name: Tests afectados por lo cambiado
        if: env.COMPLETA != 'true'
        run: npm run test:cambios
      # ---- Modo COMPLETO (camino a producción) ----
      - name: Tests unitarios y de componentes
        if: env.COMPLETA == 'true'
        run: npm test
      - name: Navegador para Playwright
        if: env.COMPLETA == 'true'
        run: npx playwright install --with-deps chromium
      - name: E2E (build SSG + reservas, carta de vinos, cheques regalo, responsive)
        if: env.COMPLETA == 'true'
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  calidad:
    # Solo en modo completo; en modo ligero el typecheck y el ESLint de lo cambiado van en tests-y-e2e.
    if: ${{ github.base_ref == 'main' || github.ref_name == 'main' || startsWith(github.ref_name, 'release/') || startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Typecheck de los E2E
        run: npx tsc --noEmit -p e2e
      - name: ESLint
        run: npm run lint -- --quiet

  control-release:
    name: Validar release a producción
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Producción solo acepta PR desde release/X.Y.Z (scripts/release.mjs comprobar): nada de
    # staging entero, versión y CHANGELOG coherentes y basada en el último main.
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release/'))
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rama, versión, CHANGELOG y base de la release
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: node scripts/release.mjs comprobar --base origin/main --head HEAD --rama "$RAMA"
