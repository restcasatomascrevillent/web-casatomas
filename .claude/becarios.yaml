# Configuración de los becarios para ESTE proyecto (web de Casa Tomás).
# Generada con /becarios-configurar el 28-10-2026. Se versiona con el código.
# Nunca pongas aquí secretos: solo nombres de variables o de secretos del CI.

proyecto: web-casatomas
repositorio: restcasatomascrevillent/web-casatomas
rama_principal: main          # producción; nadie empuja aquí (ver reglas_repo)
estrategia_merge: merge       # solo «Create a merge commit»: con squash o rebase Vercel no publica

# Reglas de este repo (CLAUDE.md y docs/PROCESO-DE-CAMBIOS.md). Mandan sobre el
# proceso general de los becarios cuando no coincidan.
reglas_repo:
  rama_trabajo: staging       # se desarrolla en staging o en una rama que luego se integra en staging
  pr_promocion: automatico    # al subir a staging, el workflow «Propuesta a producción» abre o actualiza el PR staging → main
  fusiona_pr: dueño           # ningún becario fusiona PR ni empuja a main; tras el «sí», el dueño acepta el PR en GitHub
  sin_force_push: true
  autor_commits: "Claude <noreply@anthropic.com>"   # git -c user.name=Claude -c user.email=noreply@anthropic.com commit …
  version: "La calcula scripts/version.mjs; no se edita versionado.json salvo que el dueño cambie de mayor"
  supabase: "Funciones primero en la demo; en producción solo tras aceptar el PR y con el «sí» del dueño. Las migraciones viven en el repo del panel (admin-casatomas)"
  proyecto_viejo: "jeamoczmbfsnwkfjxcyo no se toca"

# Condición de inicio: el equipo no arranca hasta que las tres sean true.
# Comprobado el 28-10-2026 sobre el contenido de main b962179 (v0.5).
condicion_inicio:
  estabilizado: true      # npm ci, lint (0 errores, 21 avisos), tipos (0 errores), 651 unitarias y build del CI en verde
  desplegado: true        # PROD responde 200 y /version.json da v0.5 · b962179; DEMO responde 302 al login de Vercel
  ci_cd_operativo: true   # CI en verde en staging (d5e7e1e) y en main (b962179); demo y PROD los publica Vercel

stack:
  frontend: react 18 + vite 5 + vite-react-ssg (SSG), react-router 6, tailwind + shadcn/radix
  backend: supabase edge functions (deno), stripe en los cheques regalo
  bbdd: supabase-postgres (demo sfonaclosuafvlhutkon · prod haqmmdfdzzatdnrrcgez)
  rutas:                  # propiedad de carpetas por agente (evita pisarse)
    frontend: [src/pages, src/components, src/hooks, src/i18n, src/lib, src/data, src/utils, public]
    backend-servicios: [supabase/functions]
    backend-datos: []     # las migraciones van en admin-casatomas/supabase/migrations, no en este repo
    tests: [src/__tests__, src/lib/__tests__, scripts/__tests__, e2e]

comandos:                 # se ejecutan desde la raíz del repo
  instalar: npm ci
  lint: npm run lint
  tipos: npx tsc --noEmit -p tsconfig.app.json
  unitarias: npm test
  # npm run build necesita VITE_SUPABASE_URL y VITE_SUPABASE_PUBLISHABLE_KEY (prerenderiza la carta);
  # sin ellas, este es el build del CI contra un Supabase falso local.
  build: node scripts/e2e-build.mjs
  e2e: npm run test:e2e   # obligatorio si se tocan reservas, carta, cheques o maquetación
  migraciones_local: ""

ci_cd:
  proveedor: github-actions + vercel
  desplegar_demo: "git push origin HEAD:staging"   # Vercel publica la demo en 1–3 min; comprobar estado READY
  desplegar_prod: ""      # no lo lanza ningún becario: lo publica Vercel cuando el dueño acepta el PR staging → main
  desplegar_funciones_demo: "SUPABASE_ACCESS_TOKEN=\"$SUPABASE_ACCESS_TOKEN_DEMO\" npx supabase functions deploy <función> --project-ref sfonaclosuafvlhutkon"
  desplegar_funciones_prod: "SUPABASE_ACCESS_TOKEN=\"$SUPABASE_ACCESS_TOKEN_PROD\" npx supabase functions deploy <función> --project-ref haqmmdfdzzatdnrrcgez"   # solo tras aceptar el PR y con el «sí» del dueño
  estado_ultima_ejecucion: "gh run list --workflow ci.yml --branch staging -L 1"   # en la nube, con las herramientas de GitHub
  rollback_prod: "Vercel → Deployments → despliegue anterior → ⋯ → Instant Rollback (el dueño). El arreglo vuelve por staging"
  artefactos_qa: "GitHub Actions → artefacto playwright-report (solo si falla, 7 días)"

entornos:
  dev:
    descripcion: desarrollo y validación local
  demo:
    url: https://web-casatomas-git-staging-casa-tomas.vercel.app
    datos: copia de los datos reales, sin Stripe ni Resend (no cobra ni manda correos)
    acceso: "Pide entrar con la cuenta de Vercel: usar get_access_to_vercel_url del MCP de Vercel"
    version: https://web-casatomas-git-staging-casa-tomas.vercel.app/version.json
    cubre_qa: true
    cubre_stg: true
    qa_separado: false
    stg_separado: false
  qa:
    url: ""
  stg:
    url: ""
  prod:
    url: https://web-casatomas.vercel.app
    datos: reales
    healthcheck: https://web-casatomas.vercel.app/version.json

datos_de_prueba:
  semillas: ""            # la demo es una copia de los datos reales
  cuentas:                # la web no tiene inicio de sesión
    demo: ""
    prod: ""
  # En PROD solo pruebas de lectura: navegar y comprobar. Nada de reservas, compras
  # de cheques regalo ni envío de formularios.

diseno:
  fuente: "No hay Figma: la referencia es la web en producción y los componentes shadcn/Tailwind del repo"
  resoluciones:           # ancho x alto
    movil: 375x812
    tablet: 768x1024
    escritorio: 1440x900

notion:
  historias: https://app.notion.com/p/2ad3221d8eb780e98cb3d3e45b98ab27    # OficiosOS
  registro: https://app.notion.com/p/bd829ac748a040999ab46614eafd2c3e     # Registro de entrega
  propiedades:
    proyecto: Proyecto relacionado
  estados:
    sin_empezar: Por hacer
    en_progreso: En progreso
    en_espera: En espera
    hecha: Hecha
  valor_proyecto: Casa Tomás
  extra:
    Área: Producto

# Accesos de los becarios (guía: .claude/becarios/reference/accesos.md). Aquí solo
# identificadores; los tokens van en el entorno en la nube «Casa Tomás» con los
# nombres fijos de la guía. GitHub va por la conexión de Claude con la cuenta del
# dueño. Comprobación: bash .claude/becarios/scripts/comprobar-accesos.sh
accesos:
  entorno_nube: "Casa Tomás"
  supabase_demo: sfonaclosuafvlhutkon            # casatomas-staging
  supabase_prod: haqmmdfdzzatdnrrcgez            # casatomas-prod (el viejo jeamoczmbfsnwkfjxcyo no se toca)
  vercel_equipo: team_18KKVg7ueSX0PL4Ycy1QakZj   # casa-tomas
  vercel_proyecto: prj_0sGVG2CWWPpZWwy1zrr0nCPftcYQ   # web-casatomas
  stripe: false                                  # la demo no cobra y en PROD no se compra
  resend: false                                  # la demo no manda correos

pausas:
  # Los becarios SIEMPRE se paran cuando el PR está listo y esperan tu «sí».
  # Aquí el «sí» no lo fusiona nadie más que tú: lo aceptas en GitHub y después
  # siguen con la comprobación de PROD, el QA en PROD y el cierre.
  antes_de_prod: false

limites:
  rondas_correccion: 3    # también cuenta cada vuelta extra de frontend (máx. 25 turnos por vuelta: maxTurns en .claude/agents/frontend.md)
